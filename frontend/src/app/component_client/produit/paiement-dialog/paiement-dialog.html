<div class="p-6 max-w-lg">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
            <mat-icon class="text-green-600">payment</mat-icon>
            Procéder au paiement
        </h2>
        <button (click)="fermer()" class="text-gray-400 hover:text-gray-600 transition">
            <mat-icon>close</mat-icon>
        </button>
    </div>

    <!-- Résumé du panier -->
    <div class="bg-gray-50 rounded-xl p-4 mb-6">
        <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-gray-800">{{ data.panier.nom }}</h3>
            <span class="text-sm text-gray-500">{{ data.panier.nombre_produits }} produit(s)</span>
        </div>

        <!-- Mini liste des produits -->
        <div class="space-y-2 max-h-40 overflow-y-auto mb-3">
            <div *ngFor="let pp of data.panier.produits"
                class="flex items-center justify-between text-sm py-1 border-b border-gray-200 last:border-0">
                <div class="flex items-center gap-2 flex-1 min-w-0">
                    <div class="w-8 h-8 rounded bg-gray-200 overflow-hidden flex-shrink-0 flex items-center justify-center">
                        <img *ngIf="pp.id_produit?.photo" [src]="pp.id_produit.photo" class="w-full h-full object-cover" />
                        <mat-icon *ngIf="!pp.id_produit?.photo" class="text-gray-400 text-sm">inventory_2</mat-icon>
                    </div>
                    <span class="truncate text-gray-700">{{ pp.id_produit?.nom || 'Produit' }}</span>
                    <span class="text-gray-400">x{{ pp.quantite }}</span>
                </div>
                <span class="font-semibold text-gray-800 ml-2">{{ pp.sous_total | number:'1.0-0' }} Ar</span>
            </div>
        </div>

        <div class="flex items-center justify-between pt-2 border-t border-gray-300">
            <span class="font-bold text-gray-800">Total</span>
            <span class="text-2xl font-bold text-orange-600">{{ data.panier.total | number:'1.0-0' }} Ar</span>
        </div>
    </div>

    <!-- Mode de paiement -->
    <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-3">Mode de paiement</label>
        <div class="grid grid-cols-2 gap-3">
            <!-- Mvola -->
            <label class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all"
                [class]="modePaiement === 'Mvola'
                    ? 'border-yellow-500 bg-yellow-50 shadow-md'
                    : 'border-gray-200 hover:border-yellow-300 hover:bg-gray-50'">
                <input type="radio" name="paiement" value="Mvola" [(ngModel)]="modePaiement" class="hidden" />
                <div class="w-14 h-14 rounded-xl flex items-center justify-center"
                    [class]="modePaiement === 'Mvola' ? 'bg-yellow-500 text-white' : 'bg-yellow-100 text-yellow-600'">
                    <mat-icon class="text-3xl">phone_android</mat-icon>
                </div>
                <span class="font-semibold text-sm" [class]="modePaiement === 'Mvola' ? 'text-yellow-700' : 'text-gray-700'">
                    Mvola
                </span>
                <span class="text-xs text-gray-500">Mobile Money</span>
            </label>

            <!-- Visa -->
            <label class="flex flex-col items-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all"
                [class]="modePaiement === 'Visa'
                    ? 'border-blue-500 bg-blue-50 shadow-md'
                    : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50'">
                <input type="radio" name="paiement" value="Visa" [(ngModel)]="modePaiement" class="hidden" />
                <div class="w-14 h-14 rounded-xl flex items-center justify-center"
                    [class]="modePaiement === 'Visa' ? 'bg-blue-500 text-white' : 'bg-blue-100 text-blue-600'">
                    <mat-icon class="text-3xl">credit_card</mat-icon>
                </div>
                <span class="font-semibold text-sm" [class]="modePaiement === 'Visa' ? 'text-blue-700' : 'text-gray-700'">
                    Visa
                </span>
                <span class="text-xs text-gray-500">Carte bancaire</span>
            </label>
        </div>
    </div>

    <!-- Adresse de livraison -->
    <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">
            <mat-icon class="text-sm align-middle mr-1">location_on</mat-icon>
            Adresse de livraison
        </label>
        <textarea [(ngModel)]="adresseLivraison" rows="3"
            placeholder="Ex: Lot IVA 123, Analakely, Antananarivo 101..."
            class="w-full py-2.5 px-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-green-500 focus:border-green-500 transition resize-none"></textarea>
    </div>

    <!-- Bouton confirmer -->
    <button (click)="confirmerPaiement()"
        [disabled]="!modePaiement || !adresseLivraison.trim() || submitting"
        class="w-full py-3.5 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 disabled:from-gray-300 disabled:to-gray-300 disabled:cursor-not-allowed text-white font-bold rounded-xl transition flex items-center justify-center gap-2 shadow-lg text-lg">
        <mat-icon *ngIf="!submitting">lock</mat-icon>
        <div *ngIf="submitting" class="animate-spin rounded-full h-5 w-5 border-t-2 border-white"></div>
        {{ submitting ? 'Traitement en cours...' : 'Confirmer le paiement' }}
    </button>

    <p class="text-center text-xs text-gray-500 mt-3 flex items-center justify-center gap-1">
        <mat-icon class="text-sm">verified_user</mat-icon>
        Paiement sécurisé
    </p>
</div>
