
<div class="flex items-center justify-center min-h-[calc(100vh-300px)] p-4">
      <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
                  <div class="bg-gradient-to-r from-primary-800 to-secondary-600 p-4 text-center">
                        <div class="w-20 h-20 bg-gray-200 rounded-full mx-auto mb-2 flex items-center justify-center">
                              <img src="imazy/5900478.png" alt="Logo" class="w-12 h-12 object-contain" />
                        </div>
                        <div class="text-center font-bold text-primary-100 mb-4">
                              SHOPPING CENTER
                        </div>
                  <div class="flex items-center justify-center mt-2 space-x-2">
                        <hr class="border-primary-200 w-40" />
                              <span class="text-xs text-primary-50">S'authentifier</span>
                        <hr class="border-primary-200 w-40" />
                  </div>
                  </div>
                  <div class="p-8 bg-gray-300">
                        <form class="space-y-4">
                              <div class="space-y-2">
                                    <label for="email" class="block text-sm font-semibold text-neutral-700">
                                          Email :
                                    </label>
                                          <span class="p-input-icon-left w-full block">
                                          <i class="pi pi-envelope text-neutral-400"></i>
                                    <input 
                                          type="email" 
                                          id="email"
                                          pInputText 
                                          class="w-full pl-10 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                          placeholder="votre.email@exemple.com"
                                    />
                                    </span>
                              </div>

                              <div class="space-y-2">
                                    <label for="password" class="block text-sm font-semibold text-neutral-700">
                                          Mot de passe :
                                    </label>
                                          <span class="p-input-icon-left w-full block">
                                          <i class="pi pi-lock text-neutral-400"></i>
                                    <input 
                                          type="password" 
                                          id="password"
                                          pInputText 
                                          class="w-full pl-10 py-2 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all"
                                          placeholder="••••••••"
                                    />
                                    </span>
                              </div>

                              <div class="flex items-center justify-between">
                                    <div class="flex items-center">
                                          <input 
                                                type="checkbox" 
                                                id="remember" 
                                                class="w-4 h-4 text-primary-500 border-neutral-300 rounded focus:ring-primary-500 cursor-pointer"
                                          />
                                          <label for="remember" class="ml-2 text-sm text-neutral-600 cursor-pointer">
                                                Se souvenir de moi
                                          </label>
                                    </div>
                                    <a href="#" class="text-sm text-primary-500 hover:text-primary-600 font-medium transition-colors">
                                          Mot de passe oublié ?
                                    </a>
                              </div>

                              <button 
                                    type="submit"
                                    class="w-full bg-gradient-to-r from-primary-800 to-secondary-600 hover:from-primary-600 hover:to-secondary-600 text-white font-semibold py-2 rounded-lg shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center"
                              >
                                    <i class="pi pi-sign-in mr-2"></i>
                                    Se connecter
                              </button>
                        </form>

                        <div class="mt-6 text-center pb-2">
                              <p class="text-neutral-600 text-sm">
                                    Vous n'avez pas de compte ?
                                    <a href="#" class="text-primary-500 hover:text-primary-600 font-semibold transition-colors hover:underline">
                                    Créer un compte
                                    </a>
                              </p>
                        </div>
                  </div>
            </div>
            <div class="mt-6 text-center">
                  <div class="inline-flex items-center px-4 py-2 bg-warning-50 border border-warning-200 rounded-lg">
                        <i class="pi pi-exclamation-triangle text-warning-600 mr-2"></i>
                        <span class="text-warning-800 text-sm font-medium">
                              Accès réservé aux gestionnaires du centre commercial
                        </span>
                  </div>
            </div>
      </div>
</div>
