<div class="bg-white rounded-2xl shadow-lg overflow-hidden">
    <div class="px-6 py-4 border-b border-neutral-200 bg-gradient-to-r from-primary-50 to-secondary-50">
        <h2 class="text-lg font-bold text-neutral-800 flex items-center gap-2">
            <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            Recharger mon portefeuille
        </h2>
        <p class="text-sm text-neutral-500 mt-1">Ajoutez de l'argent pour payer vos abonnements</p>
    </div>

    <div class="p-6 space-y-5">

        <div *ngIf="successMessage" class="bg-green-50 border border-green-300 rounded-xl p-3 flex items-center gap-2 text-green-700">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-sm font-medium">{{ successMessage }}</p>
        </div>

        <div *ngIf="errorMessage" class="bg-red-50 border border-red-300 rounded-xl p-3 flex items-center gap-2 text-red-700">
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-sm font-medium">{{ errorMessage }}</p>
        </div>

        <div>
            <p class="text-xs text-neutral-500 uppercase tracking-widest font-medium mb-3">Montant rapide</p>
            <div class="flex flex-wrap gap-2">
                <button *ngFor="let m of montantsRapides"
                    (click)="selectMontantRapide(m)"
                    class="px-4 py-2 rounded-lg text-sm font-semibold border-2 transition-all duration-150"
                    [class.border-primary-500]="montant === m"
                    [class.bg-primary-50]="montant === m"
                    [class.text-primary-700]="montant === m"
                    [class.border-neutral-200]="montant !== m"
                    [class.text-neutral-600]="montant !== m"
                    [class.hover:border-primary-300]="montant !== m">
                    {{ m | number }} Ar
                </button>
            </div>
        </div>
        <div>
            <label for="montantInput" class="text-xs text-neutral-500 uppercase tracking-widest font-medium block mb-2">Ou saisir un montant</label>
            <div class="relative">
                <input
                    id="montantInput"
                    type="number"
                    [(ngModel)]="montant"
                    min="1"
                    placeholder="Entrez un montant en Ariary"
                    class="w-full px-4 py-3 pr-14 border-2 border-neutral-200 rounded-xl text-lg font-semibold text-neutral-800 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-100 transition-all" />
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm font-medium text-neutral-400">Ar</span>
            </div>
        </div>

        <div class="bg-neutral-50 rounded-xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="text-sm text-neutral-600">
                <span *ngIf="montant && montant > 0">
                    Nouveau solde après rechargement :
                    <span class="font-bold text-primary-700">{{ (soldeActuel + montant) | number }} Ar</span>
                </span>
                <span *ngIf="!montant || montant <= 0" class="text-neutral-400">
                    Sélectionnez ou saisissez un montant
                </span>
            </div>
            <button
                (click)="recharger()"
                [disabled]="isLoading || !montant || montant <= 0"
                class="px-6 py-2.5 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 whitespace-nowrap">
                <svg *ngIf="isLoading" class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <svg *ngIf="!isLoading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                </svg>
                {{ isLoading ? 'En cours...' : 'Recharger' }}
            </button>
        </div>

    </div>
</div>
