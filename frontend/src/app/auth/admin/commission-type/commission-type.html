<div class="min-h-screen bg-gray-100 p-8">

  <!-- Page Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-800">Types de Commission</h1>
    <p class="text-gray-500 mt-1">Gérez les types de commission disponibles</p>
  </div>

  <!-- Create Form Card -->
  <div class="bg-white rounded-2xl shadow-md p-6 mb-8 max-w-2xl">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">Ajouter un nouveau type</h2>
    <div class="flex flex-col gap-4">
      <div class="flex gap-4">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-600 mb-1">Nom</label>
          <input
            [(ngModel)]="newCommission.nom"
            placeholder="Ex: Standard"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          />
        </div>
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-600 mb-1">Tarif (Ar)</label>
          <input
            [(ngModel)]="newCommission.tarif"
            type="number"
            placeholder="Ex: 10"
            class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
          />
        </div>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Description (optionnel)</label>
        <input
          [(ngModel)]="newCommission.description"
          placeholder="Courte description..."
          class="w-full border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
        />
      </div>
      <div class="flex justify-end">
        <button
          (click)="createCommission()"
          [disabled]="!newCommission.nom || !newCommission.tarif"
          class="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold px-6 py-2 rounded-lg text-sm transition"
        >
          + Créer
        </button>
      </div>
    </div>
  </div>

  <!-- Table Card -->
  <div class="bg-white rounded-2xl shadow-md overflow-hidden max-w-2xl">
    <table class="w-full text-sm text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-6 py-3 font-semibold text-gray-600">Nom</th>
          <th class="px-6 py-3 font-semibold text-gray-600">Tarif</th>
          <th class="px-6 py-3 font-semibold text-gray-600">Description</th>
          <th class="px-6 py-3 font-semibold text-gray-600 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of commissionTypes" class="border-b border-gray-100 hover:bg-gray-50 transition">
          <td class="px-6 py-4 font-medium text-gray-800">{{ c.nom }}</td>
          <td class="px-6 py-4">
            <span class="inline-block bg-blue-100 text-blue-700 text-xs font-semibold px-2 py-1 rounded-full">
              {{ c.tarif }} Ar
            </span>
          </td>
          <td class="px-6 py-4 text-gray-500 italic">{{ c.description || '—' }}</td>
          <td class="px-6 py-4 text-right">
            <button
              (click)="deleteCommission(c._id!)"
              class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-1 rounded-lg text-xs font-medium transition"
            >
              Supprimer
            </button>
          </td>
        </tr>
        <tr *ngIf="commissionTypes.length === 0">
          <td colspan="4" class="px-6 py-8 text-center text-gray-400 italic">Aucun type de commission enregistré.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
